[project]
name = "prism-sidecar"
version = "0.5.0"
description = "Prism Python sidecar — content fetching, LLM distillation, and MCP."
authors = [{ name = "Prism Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "aiosqlite>=0.20",
    "feedparser>=6.0",
    "httpx>=0.27",
    "litellm>=1.50",
    "apscheduler>=3.10",
    "python-dateutil>=2.9",
    "bilibili-api-python>=17.4.1",
    "yt-dlp>=2025.6.9",
    "mcp>=1.28,<2",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
prism-sidecar = "prism_sidecar.__main__:main"
prism-mcp = "prism_sidecar.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism_sidecar"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pyinstaller>=6.21.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

# ---- Lint ------------------------------------------------------------------
#
# Conservative first cut: correctness rules (F/E-syntax), import order (I),
# and bugbear (B). Deliberately NOT selected yet:
#   * E501 line length — long explanatory comments are a feature of this
#     codebase, not a defect.
#   * UP (pyupgrade) — would mass-rewrite `timezone.utc` → `datetime.UTC`
#     etc.; mechanical churn we don't want mixed into feature diffs.
# Widen the ruleset later if desired; run `uv run ruff check --fix` locally.
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["packaging"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Re-export barrels: imports exist to be re-exported, not used locally.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `param: int = Query(...)` default-argument idiom is by design,
# not the mutable-default bug B008 hunts for.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Header"]
