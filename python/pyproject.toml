[project]
name = "prism-sidecar"
version = "0.1.0"
description = "Prism Python sidecar — content fetching, LLM distillation, and MCP."
authors = [{ name = "Prism Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[project.scripts]
prism-sidecar = "prism_sidecar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism_sidecar"]
